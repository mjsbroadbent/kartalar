  <div id="map" role="application" aria-label="Map of Irad"></div>
  <noscript><div style="max-width:640px;margin:40px auto;font:16px/1.5 sans-serif;padding:0 16px">
    <h1>Attelkom Kartalar: maps of Irad</h1>
    <p>An interactive map of Irad: the cities of <a href="https://irad.wiki/wiki/Talas">Talas</a>, <a href="https://irad.wiki/wiki/Nurzhan">Nurzhan</a> and <a href="https://irad.wiki/wiki/Iy%C4%B1k_Janyl">Iyık Janyl</a>, villages, roads, railways, passes, rivers and places across the Irad Special Economic Zone and the Autonomous Tribal Regions. The map needs JavaScript.</p>
    <p>Irad is a fictional country, part of a worldbuilding project. Read more on <a href="https://irad.wiki/">Irad Wiki</a>.</p>
  </div></noscript>
