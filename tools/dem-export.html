<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kartalar · elevation export</title>
  <style>
    :root { --green: #1f7a2e; }
    body { margin: 0; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; background: #f4f3ef; color: #202124; }
    main { max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { margin: 0 0 12px; color: #444; }
    .box { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 18px; background: var(--green); color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    progress { width: 100%; height: 14px; margin: 14px 0 6px; }
    canvas#preview { width: 100%; image-rendering: pixelated; border-radius: 8px; margin-top: 12px; background: #eee; }
    #log { font: 12.5px/1.5 ui-monospace, Consolas, monospace; background: #f6f6f4; border-radius: 8px; padding: 10px; max-height: 160px; overflow-y: auto; white-space: pre-wrap; margin-top: 10px; }
    a.dl { display: inline-block; margin-top: 12px; font-weight: 600; color: var(--green); }
  </style>
</head>
<body>
<main>
  <h1>Elevation export for Kartalar</h1>
  <p>Fetches terrain tiles (Mapzen/AWS Terrain Tiles, about 140 tiles) for Irad's area and turns them into one elevation grid, every 0.005° (about 450 m). It takes a minute or two. When it finishes, save the file and send it back.</p>
  <div class="box">
    <button id="go">Start</button>
    <progress id="prog" value="0" max="1" hidden></progress>
    <div id="status"></div>
    <div id="out"></div>
    <canvas id="preview" hidden></canvas>
    <div id="log"></div>
  </div>
</main>
<script>
(function () {
  const LON0 = 67.9, LON1 = 75.3, LAT0 = 40.5, LAT1 = 46.2, STEP = 0.005, Z = 9;
  const NX = Math.round((LON1 - LON0) / STEP) + 1, NY = Math.round((LAT1 - LAT0) / STEP) + 1;
  const SOURCES = ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png", "https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png"];
  const $ = id => document.getElementById(id);
  const log = s => { $("log").textContent += s + "\n"; $("log").scrollTop = 1e9; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const N = 2 ** Z;
  const px = lon => (lon + 180) / 360 * N * 256;
  const py = lat => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * N * 256; };

  async function tile(x, y) {
    for (let a = 0; a < 6; a++) {
      const url = SOURCES[a % SOURCES.length].replace("{z}", Z).replace("{x}", x).replace("{y}", y);
      try {
        const r = await fetch(url, { mode: "cors" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const bmp = await createImageBitmap(await r.blob());
        const c = new OffscreenCanvas(256, 256), g = c.getContext("2d");
        g.drawImage(bmp, 0, 0);
        const d = g.getImageData(0, 0, 256, 256).data, e = new Float32Array(65536);
        for (let i = 0; i < 65536; i++) e[i] = d[i * 4] * 256 + d[i * 4 + 1] + d[i * 4 + 2] / 256 - 32768;
        return e;
      } catch (err) { log(`  tile ${x},${y}: ${err.message}, retrying…`); await sleep(1500 * (a + 1)); }
    }
    throw new Error(`tile ${x},${y} failed`);
  }

  $("go").addEventListener("click", async () => {
    $("go").disabled = true; $("out").innerHTML = ""; $("log").textContent = "";
    const x0 = Math.floor(px(LON0) / 256), x1 = Math.floor(px(LON1) / 256), y0 = Math.floor(py(LAT1) / 256), y1 = Math.floor(py(LAT0) / 256);
    const tiles = {}, list = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) list.push([x, y]);
    $("prog").hidden = false; $("prog").max = list.length;
    let done = 0, failed = 0;
    const work = list.slice();
    async function worker() {
      while (work.length) {
        const [x, y] = work.shift();
        try { tiles[x + "," + y] = await tile(x, y); } catch (e) { failed++; log(e.message); }
        $("prog").value = ++done; $("status").textContent = `Tiles ${done} of ${list.length}`;
      }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);
    $("status").textContent = "Building the grid…";
    await sleep(30);
    const grid = new Int16Array(NX * NY);
    let lo = 1e9, hi = -1e9;
    for (let j = 0; j < NY; j++) {
      const lat = LAT0 + j * STEP, Y = py(lat);
      for (let i = 0; i < NX; i++) {
        const lon = LON0 + i * STEP, X = px(lon);
        // bilinear sample
        const fx = X - 0.5, fy = Y - 0.5, ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;
        const s = (gx, gy) => { const t = tiles[Math.floor(gx / 256) + "," + Math.floor(gy / 256)]; return t ? t[(gy & 255) * 256 + (gx & 255)] : NaN; };
        const v = s(ix, iy) * (1 - tx) * (1 - ty) + s(ix + 1, iy) * tx * (1 - ty) + s(ix, iy + 1) * (1 - tx) * ty + s(ix + 1, iy + 1) * tx * ty;
        const e = isNaN(v) ? -32768 : Math.round(v);
        grid[j * NX + i] = e;
        if (e > -1000) { lo = Math.min(lo, e); hi = Math.max(hi, e); }
      }
    }
    // file: 64-byte header (magic, version, lon0, lat0, step, nx, ny), then int16 rows from south to north, west to east
    const head = new ArrayBuffer(64), hv = new DataView(head);
    "KTDEM1".split("").forEach((ch, i) => hv.setUint8(i, ch.charCodeAt(0)));
    hv.setFloat64(8, LON0, true); hv.setFloat64(16, LAT0, true); hv.setFloat64(24, STEP, true); hv.setInt32(32, NX, true); hv.setInt32(36, NY, true);
    const blob = new Blob([head, grid.buffer], { type: "application/octet-stream" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "irad-dem.bin"; a.className = "dl";
    a.textContent = `Save irad-dem.bin (${(blob.size / 1048576).toFixed(1)} MB, ${NX}×${NY}, ${lo}–${hi} m)`;
    $("out").appendChild(a);
    $("status").textContent = failed ? `Done, but ${failed} tile(s) failed (those areas are empty). Save anyway, or press Start again.` : "Done.";
    // preview
    const cv = $("preview"); cv.width = Math.ceil(NX / 4); cv.height = Math.ceil(NY / 4); cv.hidden = false;
    const g = cv.getContext("2d"), im = g.createImageData(cv.width, cv.height);
    for (let j = 0; j < cv.height; j++) for (let i = 0; i < cv.width; i++) {
      const e = grid[(NY - 1 - j * 4) * NX + i * 4], k = (j * cv.width + i) * 4, v = e < -1000 ? 0 : Math.max(0, Math.min(255, (e - lo) / (hi - lo) * 255));
      im.data[k] = v; im.data[k + 1] = v; im.data[k + 2] = v; im.data[k + 3] = 255;
    }
    g.putImageData(im, 0, 0);
    a.click();
    $("go").disabled = false;
  });
})();
</script>
</body>
</html>
